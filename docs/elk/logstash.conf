input {
  # 从文件读取日志(JSON格式)
  file {
    path => "/var/logs/**/*.json.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "application-log"
  }

  # 从TCP接收日志(应用直接发送)
  tcp {
    port => 5044
    codec => "json"
    type => "application-log"
  }
}

filter {
  # 解析JSON日志
  if [type] == "application-log" {
    json {
      source => "message"
    }
    
    # 添加应用名称字段(从日志路径提取)
    mutate {
      gsub => ["path", "/var/logs/", ""]
      gsub => ["path", "/.*", ""]
      rename => { "path" => "service_name" }
    }
    
    # 解析时间戳
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
    
    # 删除不需要的字段
    mutate {
      remove_field => ["path", "host", "port"]
    }
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "gov-todo-%{service_name}-%{+YYYY.MM.dd}"
  }
  
  # 调试输出(可选)
  stdout {
    codec => rubydebug
  }
}
