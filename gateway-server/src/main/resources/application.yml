server:
  port: 8081
spring:
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  application:
    name: gateway-server
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP
    sentinel:
      transport:
        dashboard: localhost:8080
        port: 8719
      eager: true
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":429,"message":"请求过于频繁,请稍后重试"}'
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: login-route
          uri: http://localhost:8091
          predicates:
            - Path=/api/login
          filters:
            - RewritePath=/api/login, /api/system/user/login
        - id: register-route
          uri: http://localhost:8091
          predicates:
            - Path=/api/register
          filters:
            - RewritePath=/api/register, /api/system/user/register
        - id: todo-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/todo/**,/api/activities/**,/todo/**
          filters:
            - RewritePath=/api/todo/(?<segment>.*), /api/todo/${segment}
            - RewritePath=/api/activities/(?<segment>.*), /api/activities/${segment}
        - id: system-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/roles/**,/api/permissions/**,/api/permission/**,/api/users/**,/api/departments/**,/api/modules/**,/api/system/**,/api/dict/**,/api/dicts/**,/api/approvals/**,/system/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/${segment}

auth:
  whitelist: /api/login,/api/register,/api/system/user/login,/api/system/user/register,/api/system/user/resetpd