server:
  port: 8081
spring:
  main:
    # 强制使用响应式 Web 应用类型（Gateway 与 Spring MVC 不兼容）
    web-application-type: reactive
    # 允许 Bean 定义覆盖（避免 Sentinel 自动配置冲突）
    allow-bean-definition-overriding: true
  application:
    name: gateway-server
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: false
        register-enabled: false
        namespace: public
        group: DEFAULT_GROUP
    sentinel:
      transport:
        dashboard: localhost:8080
        port: 8719
      eager: true
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":429,"message":"请求过于频繁,请稍后重试"}'
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Login Route - 专门处理登录接口
        - id: login-route
          uri: http://localhost:8091
          predicates:
            - Path=/api/login
          filters:
            - RewritePath=/api/login, /api/system/user/login
        # Register Route
        - id: register-route
          uri: http://localhost:8091
          predicates:
            - Path=/api/register
          filters:
            - RewritePath=/api/register, /api/system/user/register
        # Todo Service
        - id: todo-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/todo/**,/todo/**
          filters:
            - RewritePath=/api/todo/(?<segment>.*), /api/todo/${segment}
        # System Service
        - id: system-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/roles/**,/api/permissions/**,/api/permission/**,/api/users/**,/api/departments/**,/api/modules/**,/api/system/**,/system/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/${segment}

# 认证白名单配置
auth:
  whitelist: /api/login,/api/register,/api/system/user/login,/api/system/user/register,/api/system/user/resetpd
